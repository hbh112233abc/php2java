server:
  port: 8080 # 端口号
  servlet:
    context-path: /api # 统一请求前缀
    max-http-header-size: 10MB # 最大请求头

spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/test?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai
    username: root
    password: root
  data:
    # redis
    redis:
      # 数据库索引(默认0)
      database: 2
      # 服务器地址
      host: 192.168.103.114
      # 端口
      port: 6379
      # 密码(默认为空)
      password: infini_rag_flow
      # 连接超时
      timeout: 10s
      lettuce:
        pool:
          # 连接池最大连接数
          max-active: 200
          # 连接池最大阻塞等待时间(负值:没有限制)
          max-wait: -1ms
          # 连接池中最大空闲连接
          max-idle: 10
          # 连接池中最小空闲连接
          min-idle: 0
  devtools:
    restart:
      # 开启热重载（默认就是 true，显式写出更清晰）
      enabled: true
      # 排除不需要触发重启的路径
      exclude: static/**,public/**,templates/**
      # 指定需要额外监控的路径（默认只监控 classpath）
      additional-paths: src/main/java
      # 触发重启前等待的轮询间隔（毫秒），默认 1000
      poll-interval: 1000
      # 静默期，单位毫秒，默认 400，避免连续保存时频繁重启
      quiet-period: 400
    # 关闭 livereload（如果不用浏览器自动刷新可关掉）
    livereload:
      enabled: false

# MyBatis-Plus 配置 (可选)
mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl # 开启 SQL 日志，方便调试
    map-underscore-to-camel-case: true # 默认开启，下划线转驼峰
  mapper-locations: classpath*:/mapper/**/*.xml # 如果使用 XML 文件，指定其位置

############## Sa-Token 配置 (文档: https://sa-token.com) ##############
sa-token:
  # token 名称（同时也是 cookie 名称）
  token-name: Authorization
    # token 有效期（单位：秒） 默认30天，-1 代表永久有效
  timeout: 2592000
    # token 最低活跃频率（单位：秒），如果 token 超过此时间没有访问系统就会被冻结，默认-1 代表不限制，永不冻结
  active-timeout: -1
    # 是否允许同一账号多地同时登录 （为 true 时允许一起登录, 为 false 时新登录挤掉旧登录）
  is-concurrent: true
    # 在多人登录同一账号时，是否共用一个 token （为 true 时所有登录共用一个 token, 为 false 时每次登录新建一个 token）
  is-share: false
    # token 风格（默认可取值：uuid、simple-uuid、random-32、random-64、random-128、tik）
  token-style: uuid
    # 是否输出操作日志
  is-log: true


springdoc:
  swagger-ui:
    path: /swagger-ui.html      # 自定义 UI 路径
    enabled: true               # 是否启用 Swagger UI
  api-docs:
    path: /v3/api-docs          # 自定义 API 文档路径
    enabled: true               # 是否启用文档生成

# 链路追踪已在 BraveTracingConfig 中通过 Brave 原生方式实现，
# Spring Boot 4 已移除 Micrometer Tracing 的自动配置，故无需（也无法）再用 management.tracing.* 开启。
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics   # 方便查看运行时端点
